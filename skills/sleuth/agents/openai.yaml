interface:
  display_name: "SLEUTH"
  short_description: "Read-only SIREN IR; reports require user confirmation."
  brand_color: "#0F766E"
  default_prompt: "Use $sleuth to investigate this specific host incident through SIREN and return evidence-bounded verified findings. Do not generate a formal report unless I explicitly confirm it."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "siren"
      description: "SIREN MCP server exposing scoped client listing and remote command execution."
