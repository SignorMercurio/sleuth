name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate.py
      - run: python3 scripts/permission_probe.py
      - run: python3 scripts/gen_trust_report.py --check
      - run: python3 evals/runtime/run_mock_siren_tests.py
